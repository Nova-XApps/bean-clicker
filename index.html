<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bean Empire 🫘 — Cookie Clicker Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #05080f;
  --bg2:       #080d18;
  --panel:     #0b1020;
  --panel2:    #0e1428;
  --border:    rgba(180,140,60,0.12);
  --border2:   rgba(180,140,60,0.28);
  --gold:      #e8b84b;
  --gold2:     #f5d07a;
  --amber:     #d97c2a;
  --green:     #4ec46e;
  --blue:      #4a9de8;
  --red:       #e05050;
  --muted:     #6a7a9a;
  --text:      #dde0e8;
  --text2:     #a0aac0;
  --glow:      rgba(232,184,75,0.18);
  --scrollbar: rgba(232,184,75,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  font-family:'Crimson Pro',serif;
  color:var(--text);
  display:flex;
  flex-direction:column;
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:10px;}

#ticker{
  background:linear-gradient(90deg,#0a0f1e,#0d1530,#0a0f1e);
  border-bottom:1px solid var(--border2);
  padding:7px 0;overflow:hidden;white-space:nowrap;flex-shrink:0;
}
#tickerInner{
  display:inline-block;animation:tickerMove 50s linear infinite;
  font-size:0.78rem;color:var(--gold2);font-style:italic;letter-spacing:0.03em;
}
@keyframes tickerMove{0%{transform:translateX(100vw);}100%{transform:translateX(-100%);}}

#app{
  display:grid;
  grid-template-columns:240px 1fr 300px;
  flex:1;overflow:hidden;
}
@media (max-width: 860px){
  #app{grid-template-columns:1fr;overflow-y:auto;}
  #midCol, #rightCol{display:block;border-right:none;}
}

#leftCol{
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
  border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;
}
#beanSection{
  display:flex;flex-direction:column;align-items:center;
  padding:18px 14px 10px;position:relative;
}
#beanWrap{
  position:relative;cursor:pointer;
  width:150px;height:150px;
  display:flex;align-items:center;justify-content:center;
}
#beanGlow{
  position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 70%);
  animation:pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
#beanEmoji{font-size:100px;line-height:1;transition:transform 0.08s cubic-bezier(.34,1.56,.64,1),filter 0.1s;filter:drop-shadow(0 12px 28px rgba(232,184,75,0.2));}
#beanEmoji.clicked{transform:scale(0.82) rotate(-6deg)!important;filter:drop-shadow(0 4px 12px rgba(232,184,75,0.5))!important;}
#clickHint{font-size:0.7rem;color:var(--muted);margin-top:4px;letter-spacing:0.08em;}
#gasCounter{text-align:center;padding:12px 14px 6px;}
#gasNum{font-family:'Cinzel',serif;font-size:1.9rem;font-weight:900;color:var(--gold);letter-spacing:-0.02em;text-shadow:0 0 20px var(--glow);}
#gasLabel{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;}
#gpsLine{font-size:0.82rem;color:var(--text2);margin-top:4px;}
#gpsLine span{color:var(--gold2);font-weight:600;}
#comboSection{padding:6px 14px;}
#comboRow{display:flex;justify-content:space-between;margin-bottom:4px;}
#comboLabel{font-size:0.7rem;color:var(--amber);font-family:'Space Mono',monospace;font-weight:700;}
#critLabel{font-size:0.63rem;color:var(--muted);font-family:'Space Mono',monospace;}
#comboBar{height:3px;background:var(--panel2);border-radius:10px;overflow:hidden;}
#comboFill{height:100%;width:0%;background:linear-gradient(90deg,var(--amber),var(--gold));border-radius:10px;transition:width 0.2s;}
#zoneSection{padding:8px 14px;}
#zoneName{font-family:'Cinzel',serif;font-size:0.82rem;font-weight:700;color:var(--gold2);}
#zoneBarWrap{height:7px;background:var(--panel2);border-radius:10px;overflow:hidden;margin:4px 0;}
#zoneBarFill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:10px;transition:width 0.4s;}
#zoneTarget{font-size:0.63rem;color:var(--muted);font-family:'Space Mono',monospace;}
#miniStats{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px 14px;}
.mstat{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:6px 8px;}
.mstat label{font-size:0.56rem;color:var(--muted);display:block;}
.mstat span{font-size:0.88rem;font-weight:600;font-family:'Space Mono',monospace;}
#eventBox{margin:6px 14px;padding:7px 11px;background:var(--panel);border:1px solid var(--border);border-radius:9px;font-size:0.75rem;color:var(--text2);text-align:center;font-style:italic;}
#bossBox{margin:0 14px 6px;padding:9px 11px;background:linear-gradient(135deg,#2a0808,#180505);border:1px solid var(--red);border-radius:9px;cursor:pointer;display:none;text-align:center;font-weight:700;color:var(--red);animation:bossFlash 1.4s infinite alternate;}
#bossBox.show{display:block;}
@keyframes bossFlash{from{box-shadow:0 0 0 var(--red);}to{box-shadow:0 0 16px #e0505080;}}
#achieveRow{padding:6px 14px 10px;display:flex;flex-wrap:wrap;gap:5px;}
.ach-badge{font-size:1.15rem;filter:grayscale(1);opacity:0.28;transition:0.3s;cursor:default;}
.ach-badge.earned{filter:grayscale(0);opacity:1;}
#midCol{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);}
#tabBar{display:flex;gap:2px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:7px 5px;border-radius:7px;background:transparent;border:none;cursor:pointer;font-weight:600;color:var(--muted);transition:0.2s;text-transform:uppercase;}
.tab.on{background:var(--panel2);color:var(--gold);border:1px solid var(--border);}
.tab-section{display:none;flex-direction:column;flex:1;overflow:hidden;}
.tab-section.on{display:flex;}
#upgradesTab{padding:8px 10px;gap:7px;overflow-y:auto;}
.upg-section-title{font-family:'Cinzel',serif;font-size:0.62rem;font-weight:700;color:var(--gold);margin:8px 0 3px;border-bottom:1px solid var(--border);}
.upg{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 11px;cursor:pointer;display:flex;align-items:center;gap:9px;}
.upg:hover{border-color:var(--border2);background:var(--panel2);transform:translateX(3px);}
.upg.locked{opacity:0.35;pointer-events:none;}
.upg-icon{font-size:1.5rem;width:32px;text-align:center;}
.upg-info{flex:1;}
.upg-name{font-size:0.82rem;font-weight:600;}
.upg-desc{font-size:0.65rem;color:var(--muted);}
.upg-cost{font-family:'Space Mono',monospace;font-weight:700;color:var(--gold);}
.upg.bought{opacity:0.5;pointer-events:none;}
#prestigeBtn{margin:8px 10px;padding:10px;background:linear-gradient(135deg,#16122a,#0c0a1e);border:1px solid rgba(140,100,220,0.4);border-radius:10px;cursor:pointer;font-weight:700;color:#b090f0;text-align:left;}
#milestonesTab{padding:8px 10px;gap:6px;overflow-y:auto;}
.milestone{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 11px;display:flex;gap:9px;}
.milestone.done{border-color:rgba(78,196,110,0.3);background:rgba(78,196,110,0.05);}
.ms-icon{font-size:1.2rem;}
.ms-info{flex:1;}
.ms-name{font-size:0.78rem;font-weight:600;}
.ms-req{font-size:0.62rem;color:var(--gold);}
#rightCol{display:flex;flex-direction:column;background:var(--panel);overflow:hidden;}
#rightHeader{padding:9px 13px;border-bottom:1px solid var(--border);background:var(--panel2);}
#rightHeader h2{font-family:'Cinzel',serif;font-size:0.88rem;color:var(--gold2);}
#buildingList{overflow-y:auto;flex:1;padding:6px;}
.building{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);margin-bottom:1px;cursor:pointer;}
.building:first-child{border-radius:10px 10px 0 0;}
.building:last-child{border-radius:0 0 10px 10px;}
.building:hover{border-color:var(--border2);background:var(--panel);}
.building.cant{opacity:0.4;pointer-events:none;}
.b-count-badge{background:rgba(232,184,75,0.12);border-right:1px solid var(--border);width:46px;min-height:56px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900;color:var(--gold);}
.b-icon{font-size:1.6rem;width:36px;text-align:center;}
.b-info{flex:1;padding:7px 4px;}
.b-name{font-family:'Cinzel',serif;font-size:0.75rem;font-weight:700;}
.b-desc{font-size:0.6rem;color:var(--muted);}
.b-prod{font-size:0.6rem;color:var(--green);}
.b-right{padding:7px 10px;text-align:right;}
.b-cost{font-family:'Space Mono',monospace;font-weight:700;color:var(--gold);}
.toast{position:fixed;z-index:9500;bottom:24px;left:24px;background:var(--panel2);border:1px solid var(--border2);border-radius:50px;padding:7px 18px;font-size:0.78rem;font-weight:600;box-shadow:0 6px 24px black;animation:toastAnim 3s forwards;pointer-events:none;}
.toast.good{border-color:rgba(78,196,110,0.4);color:var(--green);}
@keyframes toastAnim{0%{opacity:0;transform:translateY(12px);}12%{opacity:1;transform:translateY(0);}75%{opacity:1;}100%{opacity:0;transform:translateY(-10px);}}
.floatNum{position:fixed;pointer-events:none;z-index:9000;font-family:'Space Mono',monospace;font-weight:700;font-size:1rem;color:var(--gold);animation:floatUp 1s forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-80px);}}
#overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.92);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:0.5s;}
#overlay.show{opacity:1;pointer-events:all;}
#overlayCard{background:var(--panel2);border:1px solid var(--border2);border-radius:18px;padding:36px;max-width:460px;text-align:center;}
#overlayBtn{background:var(--gold);border:none;border-radius:50px;padding:11px 30px;font-weight:700;cursor:pointer;}
#cutscene{position:fixed;inset:0;z-index:20000;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:0.7s;}
#cutscene.show{opacity:1;pointer-events:all;}
.cs-line{font-family:'Cinzel',serif;font-size:clamp(0.9rem,2.8vw,1.55rem);font-weight:900;color:#fff;opacity:0;transform:translateY(12px);transition:0.9s;margin:12px 0;}
.cs-line.show{opacity:1;transform:translateY(0);}
.cs-line.gold{color:var(--gold);}
</style>
</head>
<body>
<div id="ticker"><div id="tickerInner">🫘 BEAN EMPIRE • CLICK THE BEAN • BUILD YOUR REALM</div></div>
<div id="app">
  <div id="leftCol">
    <div id="beanSection"><div id="beanWrap" onclick="clickBean(event)"><div id="beanGlow"></div><div id="beanEmoji">🫘</div></div><div id="clickHint">Click the Bean</div></div>
    <div id="gasCounter"><div id="gasNum">0</div><div id="gasLabel">💨 Gas Produced</div><div id="gpsLine">⚡ <span id="gpsSpan">0</span> gas/sec</div></div>
    <div id="comboSection"><div id="comboRow"><span id="comboLabel">🔥 Combo x0</span><span id="critLabel">🎯 Crit 5%</span></div><div id="comboBar"><div id="comboFill"></div></div></div>
    <div id="zoneSection"><div id="zoneName">🌱 Seed Patch</div><div id="zoneBarWrap"><div id="zoneBarFill"></div></div><div id="zoneTarget">Next: 100 gas</div></div>
    <div id="miniStats"><div class="mstat"><label>🏭 Buildings</label><span id="sTotalBuildings">0</span></div><div class="mstat"><label>💠 Fracture</label><span id="sFrac">0</span></div><div class="mstat"><label>🌀 Prestige</label><span id="sPrestige">0</span></div><div class="mstat"><label>🖱️ Clicks</label><span id="sTotalClicks">0</span></div></div>
    <div id="eventBox">✨ Event feed appears here...</div>
    <div id="bossBox" onclick="defeatBoss()">⚠️ BOSS ACTIVE — Click to fight!</div>
    <div id="achieveRow"></div>
  </div>
  <div id="midCol">
    <div id="tabBar"><button class="tab on" data-tab="upgrades" onclick="switchTab('upgrades')">⚡ Upgrades</button><button class="tab" data-tab="milestones" onclick="switchTab('milestones')">🏅 Goals</button><button class="tab" data-tab="lb" onclick="switchTab('lb')">🏆 Scores</button></div>
    <div id="upgradesTab" class="tab-section on"></div>
    <div id="milestonesTab" class="tab-section"></div>
    <div id="lbTab" class="tab-section"><div style="padding:8px;flex:1;display:flex;flex-direction:column;gap:8px;"><div class="lb-input-row" style="display:flex;gap:6px;"><input type="text" id="playerName" placeholder="Your name" maxlength="14" style="flex:1;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px;color:white;"><button class="lb-submit" onclick="submitScore()" style="background:var(--gold);border:none;border-radius:7px;padding:6px 12px;font-weight:bold;">Submit</button></div><div id="lbList" style="overflow-y:auto;flex:1;"></div></div></div>
    <button id="prestigeBtn" onclick="doPrestige()">🌀 Quantum Leap — Prestige <small id="prestigeNote">Reach "The End…" to unlock</small></button>
  </div>
  <div id="rightCol"><div id="rightHeader"><h2>🏭 Bean Buildings</h2><p>Buy to auto-produce gas</p></div><div id="buildingList"></div></div>
</div>
<div id="cutscene"><div id="csContent"></div></div>
<div id="overlay"><div id="overlayCard"><div id="overlayTitle"></div><div id="overlayBody"></div><button id="overlayBtn" onclick="closeOverlay()">Continue</button></div></div>
<script>
// ----------------------------- 10 BUILDINGS ---------------------------------
const BUILDINGS = [
  {id:"cursor", icon:"👆", name:"Bean Cursor", baseCost:15, gps:0.1, desc:"Auto-pokes the bean", count:0},
  {id:"farm", icon:"🌱", name:"Bean Farm", baseCost:100, gps:0.5, desc:"Grows beans in fields", count:0},
  {id:"factory", icon:"🏭", name:"Gas Factory", baseCost:500, gps:4, desc:"Mass production", count:0},
  {id:"mine", icon:"⛏️", name:"Bean Mine", baseCost:2000, gps:10, desc:"Deep gas extraction", count:0},
  {id:"lab", icon:"🧪", name:"Gas Lab", baseCost:8000, gps:40, desc:"Synthetic gas", count:0},
  {id:"portal", icon:"🌀", name:"Bean Portal", baseCost:30000, gps:200, desc:"Alternate reality gas", count:0},
  {id:"rocket", icon:"🚀", name:"Space Harvester", baseCost:100000, gps:800, desc:"Cosmic dust", count:0},
  {id:"star", icon:"⭐", name:"Star Condenser", baseCost:400000, gps:3000, desc:"Starlight conversion", count:0},
  {id:"galaxy", icon:"🌌", name:"Galaxy Engine", baseCost:2e6, gps:10000, desc:"Dark matter power", count:0},
  {id:"fracture", icon:"💠", name:"Fracture Core", baseCost:15e6, gps:50000, desc:"Void energy", count:0}
];
function buildingCost(b){ return Math.floor(b.baseCost * Math.pow(1.15, b.count)); }
let buildingBoosts = {};

// ----------------------------- 12 UPGRADES ---------------------------------
const UPGRADES = [
  {id:"u1", icon:"💨", name:"Stronger Farts", cost:100, bought:false, desc:"+2 click power", eff:()=>G.clickPow+=2},
  {id:"u2", icon:"🔥", name:"Mega Burst", cost:600, bought:false, desc:"+8 click power", eff:()=>G.clickPow+=8},
  {id:"u3", icon:"💎", name:"Double Tap", cost:1500, bought:false, desc:"+15% double chance", eff:()=>G.dblChance=Math.min(0.5,G.dblChance+0.15)},
  {id:"u4", icon:"🎯", name:"Eagle Eye", cost:3500, bought:false, desc:"+12% crit chance", eff:()=>G.critChance=Math.min(0.5,G.critChance+0.12)},
  {id:"u5", icon:"✨", name:"Golden Wax", cost:10000, bought:false, desc:"×1.7 global prod", eff:()=>G.globalMult*=1.7},
  {id:"u6", icon:"🖱️", name:"Auto-Clicker I", cost:8000, bought:false, desc:"2 auto-clicks/sec", eff:()=>{ G.autoRate=2; startAutoClick(); }},
  {id:"u7", icon:"⚡", name:"Turbo Clicker", cost:50000, bought:false, desc:"+10 auto-clicks/sec", eff:()=>{ G.autoRate+=10; startAutoClick(); }},
  {id:"u8", icon:"🌱", name:"Fertilizer", cost:12000, bought:false, desc:"Bean Farms ×2", eff:()=>boostBuilding("farm",2)},
  {id:"u9", icon:"🏭", name:"Automation", cost:35000, bought:false, desc:"Factories ×2", eff:()=>boostBuilding("factory",2)},
  {id:"u10", icon:"💠", name:"Fracture Overdrive", cost:250000, bought:false, desc:"Fracture Core ×2", eff:()=>boostBuilding("fracture",2)},
  {id:"u11", icon:"🌀", name:"Dimensional Rift", cost:120000, bought:false, desc:"Portals ×2", eff:()=>boostBuilding("portal",2)},
  {id:"u12", icon:"👑", name:"Beanlord", cost:500000, bought:false, desc:"×3 global prod", eff:()=>G.globalMult*=3}
];
function boostBuilding(id,mult){ buildingBoosts[id]=(buildingBoosts[id]||1)*mult; }

// ----------------------------- 10 PET RARITIES ------------------------------
const PET_RARITIES = [
  {name:"Common", bonus:0.005, color:"#aaa"},{name:"Uncommon", bonus:0.01, color:"#8bc34a"},
  {name:"Rare", bonus:0.02, color:"#4a9de8"},{name:"Epic", bonus:0.05, color:"#b060e8"},
  {name:"Legendary", bonus:0.12, color:"#e8a030"},{name:"Mythic", bonus:0.2, color:"#ff884d"},
  {name:"Divine", bonus:0.3, color:"#ff5555"},{name:"Ethereal", bonus:0.45, color:"#dd88ff"},
  {name:"Cosmic", bonus:0.65, color:"#66ffff"},{name:"Bean God", bonus:1.0, color:"#ffd966"}
];
const PET_NAMES = ["Sprout","Beanling","Puff","Fartling","Void Pup","Nebula Cat","Quantum Mutt","Fracture Fox","Infinity Kitten","Empyrean Bean"];
let petsList = [];

// ----------------------------- GAME STATE ---------------------------------
let G = {
  gas:0, totalGasEver:0, totalClicks:0, maxCombo:0, clickPow:1, prestige:0, globalMult:1,
  fracture:0, zoneIdx:0, cutscenePlayed:false, critChance:0.05, critMult:2.5, dblChance:0,
  autoRate:1, autoOn:false, bossesDefeated:0, combo:0, comboExpire:null, frenzyMult:1, frenzyUntil:0
};
let activeBoss = null, prodTimer=null, autoClickTimer=null;

// zones & thresholds (end at 1,000,000 gas for "The End…")
const ZONE_NAMES = ["Seed Patch","Bean Field","Forest Floor","Canopy","Backyard","Main St","Skyline","Skyscraper","Cloud Bridge","Cloud Layer","High Clouds","Wind Corridor","Jet Stream","Upper Atmosphere","Stratosphere","Mesosphere","Thermosphere","Exosphere","Low Orbit","Satellite Belt","Moon Surface","Asteroid Belt","Mars Orbit","Martian Frontier","Ring World","Deep Space","Nebula Edge","Stellar Nursery","Galactic Rim","Galactic Center","Intergalactic Void","Cosmic Nexus","Quantum Realm","Black Hole Edge","Universal Throne","Beanfinity","The End…","Reality Fracture","Memory Overflow","Code Ocean","Simulation Backbone","Render Dimension","Null Space","Broken Continuum","Paradox Plains","Infinite Loop","Admin Plane","Bean Source Core","Beyond Infinity","Final Finality"];
const THE_END_IDX = 36;
function zoneThresh(i){ if(i<=0)return 0; if(i===THE_END_IDX) return 1000000; return Math.floor(1000000*Math.pow(i/THE_END_IDX,2.5)); }

function calcGPS(){ let gps=0; BUILDINGS.forEach(b=>{ gps+=b.count*b.gps*(buildingBoosts[b.id]||1); }); return gps*G.globalMult*(1+G.prestige*0.2)*petBonusMult()*(G.frenzyUntil>Date.now()?2:1); }
function petBonusMult(){ return 1 + petsList.filter(p=>p.equipped).reduce((s,p)=>s+p.bonus,0); }
function totalBuildings(){ return BUILDINGS.reduce((s,b)=>s+b.count,0); }
function calcScore(){ return Math.floor(G.fracture + G.prestige*10 + G.totalGasEver/1000); }

// add gas
function addGas(amount, fromProd=false){ let gain=amount; if(!fromProd && Math.random()<G.dblChance) gain*=2; G.gas+=gain; G.totalGasEver+=gain; checkZone(); checkAchievements(); updateUI(); }

// click bean
function clickBean(e){
  let gain = G.clickPow * (G.frenzyUntil>Date.now()? 5 : 1);
  let isCrit = Math.random()<G.critChance;
  let comboBonus = 1 + Math.min(G.combo,10)*0.05;
  if(isCrit) gain = Math.floor(gain * G.critMult * comboBonus);
  else gain = Math.floor(gain * comboBonus);
  if(Math.random()<G.dblChance) gain*=2;
  addGas(gain);
  G.totalClicks++;
  if(G.comboExpire) clearTimeout(G.comboExpire);
  G.combo = Math.min(G.combo+1, 10);
  document.getElementById("comboLabel").innerHTML = `🔥 Combo x${G.combo}`;
  document.getElementById("comboFill").style.width = (G.combo*10)+"%";
  G.comboExpire = setTimeout(()=>{ G.combo=0; updateComboUI(); }, 3000);
  const bean=document.getElementById("beanEmoji"); bean.classList.add("clicked"); setTimeout(()=>bean.classList.remove("clicked"),100);
  if(e.clientX) spawnFloat(e.clientX,e.clientY,gain,isCrit);
  updateUI();
}
function updateComboUI(){ document.getElementById("comboLabel").innerHTML=`🔥 Combo x${G.combo}`; document.getElementById("comboFill").style.width=(G.combo*10)+"%"; }

// production loop
function startProd(){ if(prodTimer) clearInterval(prodTimer); prodTimer=setInterval(()=>{ addGas(calcGPS()/10, true); },100); }
function startAutoClick(){ if(autoClickTimer) clearInterval(autoClickTimer); autoClickTimer=setInterval(()=>{ if(G.autoRate>0) addGas(G.clickPow * G.autoRate); },1000); G.autoOn=true; }

// events + click frenzy
const EVENTS = [
  { msg:"💨 Gas Surge!", act:()=>{ G.globalMult*=1.5; setTimeout(()=>{ G.globalMult/=1.5; updateUI(); },30000); return "+50% global for 30s!"; }},
  { msg:"✨ Golden Bean!", act:()=>{ let amt=G.clickPow*150; addGas(amt); return `+${fmt(amt)} gas!`; }},
  { msg:"🎯 Lucky Strike!", act:()=>{ let old=G.critChance; G.critChance=1; setTimeout(()=>{ G.critChance=old; updateUI(); },12000); return "100% crit for 12s!"; }},
  { msg:"⚡ Click Frenzy!", act:()=>{ G.frenzyUntil=Date.now()+15000; setTimeout(()=>{ G.frenzyUntil=0; toast("Click Frenzy ended","good"); updateUI(); },15000); return "CLICK POWER x5 for 15s!"; }},
  { msg:"🌱 Bean Rain", act:()=>{ addGas(calcGPS()*25); return "25s of production instantly!"; }}
];
function triggerEvent(){ let ev=EVENTS[Math.floor(Math.random()*EVENTS.length)]; let res=ev.act(); document.getElementById("eventBox").innerHTML=`✨ ${ev.msg} ${res}`; setTimeout(()=>document.getElementById("eventBox").innerHTML="✨ Waiting for next event...",7000); updateUI(); }
setInterval(triggerEvent, 45000 + Math.random()*30000);

// zone progression + cutscene
function checkZone(){ let newZone=0; for(let i=ALL_ZONES.length-1;i>=0;i--) if(G.gas>=zoneThresh(i)){ newZone=i; break; } if(newZone>G.zoneIdx){ G.zoneIdx=newZone; if(G.zoneIdx===THE_END_IDX && !G.cutscenePlayed){ G.cutscenePlayed=true; playEndCutscene(); } else toast(`🌍 Reached ${ALL_ZONES[G.zoneIdx]}!`); if(G.zoneIdx>THE_END_IDX) G.fracture++; updateZoneDisplay(); } }
const ALL_ZONES = ZONE_NAMES;
function updateZoneDisplay(){ let name=ALL_ZONES[G.zoneIdx]||"∞"; document.getElementById("zoneName").innerHTML=`🌍 ${name}`; let next=zoneThresh(G.zoneIdx+1),cur=zoneThresh(G.zoneIdx); let pct=next>cur?Math.min(100,((G.gas-cur)/(next-cur))*100):100; document.getElementById("zoneBarFill").style.width=pct+"%"; document.getElementById("zoneTarget").innerHTML=next>0?`Next: ${fmt(next)} gas`:"MAX"; }

// prestige & the end cutscene simplified (TV off/on effect)
function playEndCutscene(){ const cs=document.getElementById("cutscene"); const cont=document.getElementById("csContent"); cs.classList.add("show"); cont.innerHTML="<div class='cs-line gold'>The End.</div><div class='cs-line'>...or is it?</div>"; setTimeout(()=>{ document.querySelectorAll('.cs-line').forEach(l=>l.classList.add('show')); },100); setTimeout(()=>{ cs.style.opacity="0"; setTimeout(()=>{ cs.classList.remove("show"); cs.style.opacity=""; toast("💠 Reality Fracture unlocked! Post-story zones begin.","good"); updateUI(); },1000); },4000); }

function doPrestige(){ if(G.zoneIdx<THE_END_IDX){ toast("Reach The End… first!","bad"); return; } let gain=5+Math.floor(G.gas/1000)+G.zoneIdx; showOverlay("🌀 Quantum Leap",`Reset for <b style='color:gold'>${gain} Fracture</b> and ×${(1+(G.prestige+1)*0.2).toFixed(1)} permanent bonus. Continue?`,()=>{ G.fracture+=gain; G.prestige++; G.gas=0; G.globalMult=1; G.clickPow=1; G.zoneIdx=0; G.critChance=0.05; G.critMult=2.5; G.dblChance=0; G.autoRate=1; G.combo=0; BUILDINGS.forEach(b=>b.count=0); UPGRADES.forEach(u=>u.bought=false); buildingBoosts={}; petsList=[]; if(autoClickTimer)clearInterval(autoClickTimer); startAutoClick(); renderUpgrades(); renderBuildings(); updateUI(); toast(`🌀 Prestige Lv${G.prestige}! +${gain} FP`,"good"); }); }

// pets crate
function openCrate(){ if(G.gas<200){ toast("Need 200 gas","bad"); return; } G.gas-=200; let r=Math.random(); let rarity; if(r<0.3) rarity=0; else if(r<0.5) rarity=1; else if(r<0.67) rarity=2; else if(r<0.8) rarity=3; else if(r<0.9) rarity=4; else if(r<0.96) rarity=5; else if(r<0.99) rarity=6; else rarity=7+Math.floor(Math.random()*3); rarity=Math.min(9,rarity); let petData=PET_RARITIES[rarity]; let name= PET_NAMES[Math.floor(Math.random()*PET_NAMES.length)]+" "+petData.name; let pet={ id:Date.now()+Math.random(), name:name, rarity:petData.name, bonus:petData.bonus, equipped:false, color:petData.color }; petsList.push(pet); petsList.sort((a,b)=>b.bonus-a.bonus); petsList.forEach((p,idx)=>p.equipped=idx<3); toast(`📦 New pet: ${name} (+${(petData.bonus*100).toFixed(1)}% prod)!`,"good"); updateUI(); }

// BOSS
function trySpawnBoss(){ if(G.zoneIdx<12 || activeBoss) return; if(Math.random()<0.2){ let bosses=[{name:"🐉 Void Eater",cost:5,mult:0.7},{name:"👾 Anti-Bean",cost:10,mult:0.6},{name:"💀 Null Overlord",cost:20,mult:0.5}]; activeBoss=bosses[Math.floor(Math.random()*bosses.length)]; G._oldMult=G.globalMult; G.globalMult*=activeBoss.mult; document.getElementById("bossBox").innerHTML=`⚠️ ${activeBoss.name} — needs ${activeBoss.cost} FP to defeat`; document.getElementById("bossBox").classList.add("show"); toast(`👹 Boss appears: ${activeBoss.name}!`,"bad"); updateUI(); } }
function defeatBoss(){ if(!activeBoss) return; if(G.fracture<activeBoss.cost){ toast(`Need ${activeBoss.cost} Fracture Points`,"bad"); return; } G.fracture-=activeBoss.cost; G.globalMult=G._oldMult; G.bossesDefeated++; activeBoss=null; document.getElementById("bossBox").classList.remove("show"); toast("🏆 Boss defeated! +1 achievement progress","good"); updateUI(); }
setInterval(trySpawnBoss, 75000);

// UI Renders
function renderBuildings(){ let html=BUILDINGS.map(b=>{ let cost=buildingCost(b); let can=G.gas>=cost; let prod=b.count*b.gps*(buildingBoosts[b.id]||1)*G.globalMult*(1+G.prestige*0.2)*petBonusMult(); return `<div class="building ${can?'':'cant'}" onclick="buyBuilding('${b.id}')"><div class="b-count-badge">${b.count||0}</div><span class="b-icon">${b.icon}</span><div class="b-info"><div class="b-name">${b.name}</div><div class="b-desc">${b.desc}</div>${b.count>0?`<div class="b-prod">${fmt(prod)}/sec</div>`:''}</div><div class="b-right"><span class="b-cost">${fmt(cost)}</span></div></div>`; }).join(""); document.getElementById("buildingList").innerHTML=html; }
function buyBuilding(id){ let b=BUILDINGS.find(x=>x.id===id); let cost=buildingCost(b); if(G.gas<cost){ toast("Not enough gas!","bad"); return; } G.gas-=cost; b.count++; toast(`Bought ${b.name}!`,"good"); updateUI(); renderBuildings(); }
function renderUpgrades(){ let html=`<div class="upg-section-title">📦 PET CRATE</div><div class="upg" onclick="openCrate()"><span class="upg-icon">📦</span><div class="upg-info"><div class="upg-name">Open Pet Crate</div><div class="upg-desc">Random pet (200 gas)</div></div><span class="upg-cost">200</span></div>`; UPGRADES.forEach(u=>{ if(u.bought) html+=`<div class="upg bought"><span class="upg-icon">${u.icon}</span><div class="upg-info"><div class="upg-name">${u.name}</div><div class="upg-desc">${u.desc}</div></div><span class="upg-cost">✔</span></div>`; else html+=`<div class="upg ${G.gas>=u.cost?'':'locked'}" onclick="buyUpgrade('${u.id}')"><span class="upg-icon">${u.icon}</span><div class="upg-info"><div class="upg-name">${u.name}</div><div class="upg-desc">${u.desc}</div></div><span class="upg-cost">${fmt(u.cost)}</span></div>`; }); document.getElementById("upgradesTab").innerHTML=html; }
function buyUpgrade(id){ let u=UPGRADES.find(x=>x.id===id); if(!u||u.bought||G.gas<u.cost) return; G.gas-=u.cost; u.bought=true; u.eff(); toast(`✨ ${u.name} purchased!`,"good"); renderUpgrades(); updateUI(); }

const ACHIEVEMENTS=[{id:"first",icon:"🫘",tip:"First Click",check:()=>G.totalClicks>=1},{id:"100c",icon:"💯",tip:"100 Clicks",check:()=>G.totalClicks>=100},{id:"gas1M",icon:"🌊",tip:"1M Gas",check:()=>G.totalGasEver>=1e6},{id:"build10",icon:"🏗️",tip:"10 Buildings",check:()=>totalBuildings()>=10},{id:"prestige1",icon:"🌀",tip:"First Prestige",check:()=>G.prestige>=1},{id:"bossKill",icon:"🐉",tip:"Defeated Boss",check:()=>G.bossesDefeated>=1},{id:"theend",icon:"🏁",tip:"Reach The End…",check:()=>G.zoneIdx>=THE_END_IDX},{id:"combo10",icon:"🔥",tip:"Combo x10",check:()=>G.maxCombo>=10}];
let earnedAch=new Set();
function checkAchievements(){ let any=false; ACHIEVEMENTS.forEach(a=>{ if(!earnedAch.has(a.id) && a.check()){ earnedAch.add(a.id); toast(`🏆 ${a.tip}`,"ach"); any=true; }}); if(any) renderAchievements(); }
function renderAchievements(){ let html=ACHIEVEMENTS.map(a=>`<span class="ach-badge${earnedAch.has(a.id)?' earned':''}" data-tip="${a.tip}">${a.icon}</span>`).join(""); document.getElementById("achieveRow").innerHTML=html; }
const MILESTONES=[{icon:"🌱",name:"First Steps",req:"100 gas",check:()=>G.totalGasEver>=100},{icon:"🏭",name:"Industrialist",req:"10 buildings",check:()=>totalBuildings()>=10},{icon:"🌌",name:"Space Age",req:"Zone 20",check:()=>G.zoneIdx>=20},{icon:"🧬",name:"Prestige I",req:"Prestige 1",check:()=>G.prestige>=1},{icon:"💠",name:"Void Walker",req:"Post-story",check:()=>G.zoneIdx>THE_END_IDX}];
function renderMilestones(){ document.getElementById("milestonesTab").innerHTML=MILESTONES.map(m=>`<div class="milestone${m.check()?' done':''}"><span class="ms-icon">${m.icon}</span><div class="ms-info"><div class="ms-name">${m.name}</div><div class="ms-req">${m.check()?'✔ Complete':m.req}</div></div></div>`).join(""); }
let LB=[]; function renderLB(){ let sorted=[...LB].sort((a,b)=>b.score-a.score).slice(0,10); document.getElementById("lbList").innerHTML=sorted.map((e,i)=>`<div class="lb-entry" style="background:var(--panel);margin:2px 0;padding:5px;display:flex;gap:5px;"><span>#${i+1}</span><span style="flex:1">${e.name}</span><span>${fmt(e.score)}</span></div>`).join("")||"No scores"; }
function submitScore(){ let name=document.getElementById("playerName").value.trim()||"BeanLord"; LB.push({name,score:calcScore()}); LB=LB.slice(0,25); localStorage.setItem("beanLB",JSON.stringify(LB)); renderLB(); toast("Score submitted!","good"); }
function loadLB(){ try{ let d=localStorage.getItem("beanLB"); if(d) LB=JSON.parse(d); }catch(e){} renderLB(); }
function showOverlay(title,body,onOk){ document.getElementById("overlayTitle").innerHTML=title; document.getElementById("overlayBody").innerHTML=body; document.getElementById("overlay").classList.add("show"); window._overlayCb=onOk; }
function closeOverlay(){ document.getElementById("overlay").classList.remove("show"); if(window._overlayCb){ window._overlayCb(); window._overlayCb=null; } }
function spawnFloat(x,y,amt,crit){ let el=document.createElement("div"); el.className="floatNum"; el.innerHTML=(crit?"💥 ":"+")+fmt(amt); el.style.left=x-20+"px"; el.style.top=y-20+"px"; document.body.appendChild(el); setTimeout(()=>el.remove(),1000); }
function fmt(n){ if(n>=1e15) return (n/1e15).toFixed(2)+"Qa"; if(n>=1e12) return (n/1e12).toFixed(2)+"T"; if(n>=1e9) return (n/1e9).toFixed(2)+"B"; if(n>=1e6) return (n/1e6).toFixed(2)+"M"; if(n>=1e3) return (n/1e3).toFixed(1)+"K"; return Math.floor(n).toLocaleString(); }
function toast(msg,type){ let t=document.createElement("div"); t.className="toast"+(type==="good"?" good":""); t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function updateUI(){ document.getElementById("gasNum").innerText=fmt(G.gas); document.getElementById("gpsSpan").innerText=fmt(calcGPS()); document.getElementById("sTotalBuildings").innerText=totalBuildings(); document.getElementById("sFrac").innerText=fmt(G.fracture); document.getElementById("sPrestige").innerText=G.prestige; document.getElementById("sTotalClicks").innerText=fmt(G.totalClicks); document.getElementById("critLabel").innerHTML=`🎯 Crit ${Math.round(G.critChance*100)}%`; updateZoneDisplay(); renderBuildings(); }
function switchTab(id){ document.querySelectorAll(".tab-section").forEach(el=>el.classList.remove("on")); document.querySelectorAll(".tab").forEach(el=>el.classList.remove("on")); document.getElementById(id+"Tab").classList.add("on"); document.querySelector(`.tab[data-tab="${id}"]`).classList.add("on"); if(id==="milestones") renderMilestones(); }
function saveGame(){ localStorage.setItem("beanSave",JSON.stringify({G,BUILDS:BUILDINGS.map(b=>({id:b.id,count:b.count})),UPGS:UPGRADES.map(u=>({id:u.id,bought:u.bought})),boosts:buildingBoosts,pets:petsList,ach:[...earnedAch]})); }
function loadGame(){ let s=localStorage.getItem("beanSave"); if(!s) return; let d=JSON.parse(s); Object.assign(G,d.G); if(d.BUILDS) d.BUILDS.forEach(bd=>{ let b=BUILDINGS.find(x=>x.id===bd.id); if(b) b.count=bd.count; }); if(d.UPGS) d.UPGS.forEach(ud=>{ let u=UPGRADES.find(x=>x.id===ud.id); if(u&&ud.bought){ u.bought=true; u.eff(); } }); if(d.boosts) buildingBoosts=d.boosts; if(d.pets) petsList=d.pets; if(d.ach) d.ach.forEach(id=>earnedAch.add(id)); updateUI(); renderUpgrades(); renderAchievements(); startAutoClick(); }
setInterval(saveGame,10000); setInterval(updateUI,500);
function init(){ loadGame(); loadLB(); renderUpgrades(); renderBuildings(); renderAchievements(); updateZoneDisplay(); startProd(); if(G.autoRate>0) startAutoClick(); toast("🫘 Welcome! Click the bean and build your empire","good"); }
init();
</script>
</body>
</html>
